<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic - Cadastro</title>
    <link href="../output.css" rel="stylesheet"> 
</head>
<body class="bg-[#1A1A1A] text-gray-200 min-h-screen font-sans flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#2D2D2D] p-8 sm:p-10 rounded-lg shadow-2xl">
        
        <div class="h-24 w-24 rounded-full bg-white p-2 mx-auto mb-6">
            <img src="../resources/mimic.png" alt="Logo Mimic" class="h-full w-full object-contain">
        </div>

        <h2 class="text-3xl font-bold text-white text-center mb-2">Cadastrar</h2>
        <hr class="border-t-2 border-red-600 mb-8">

        <form id="cadastro-form">
            <div class="space-y-6">
                <div>
                    <label for="email" class="block text-lg font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" name="email"
                           class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 text-lg"
                           placeholder="seu@email.com" required>
                </div>
                
                <div>
                    <label for="senha" class="block text-lg font-medium text-gray-300 mb-2">Senha</label>
                    <input type="password" id="senha" name="senha"
                           class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 text-lg"
                           placeholder="********" required>
                </div>

                <div>
                    <label for="confirmar-senha" class="block text-lg font-medium text-gray-300 mb-2">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha"
                           class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 text-lg"
                           placeholder="********" required>
                </div>
            </div>

            <p id="cadastro-message" class="text-center mt-4 hidden"></p>

            <div class="mt-8">
                <button type="submit"
                        class="w-full p-3 rounded bg-red-600 hover:bg-red-500 text-white font-semibold transition duration-200 text-lg">
                    Finalizar Cadastro
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-gray-400 hover:text-red-500 hover:underline transition-colors">
                Já tem uma conta? Faça o login
            </a>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
