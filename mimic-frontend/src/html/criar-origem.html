<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic - Criar Origem</title>
    <link href="../output.css" rel="stylesheet">
</head>
<body class="bg-[#1A1A1A] text-gray-200 min-h-screen font-sans">

    <header class="bg-[#444444] p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex items-center space-x-4">
            
            <div class="h-16 w-16 rounded-full bg-white">
                <!-- Adicionado link para a tela principal -->
                <a href="tela-principal.html">
                    <img src="../resources/mimic.png" alt="Logo Mimic" class="h-full w-full object-contain">
                </a>
            </div>
            
            <h1 class="text-3xl font-bold text-white">Mimic</h1>
        
        </div>
    </header>

    <main class="container mx-auto p-8">

        <div class="max-w-4xl mx-auto bg-[#2D2D2D] p-6 sm:p-8 rounded-lg shadow-2xl">
            
            <h2 class="text-3xl font-semibold text-white mb-2">Criar Origem</h2>
            <hr class="border-t-2 border-red-600 mb-8">

            <!-- 
                - Alterado method="POST" para "GET" para evitar o erro 405
                - Adicionado id="origem-form" para o JavaScript
            -->
            <form action="#" method="GET" id="origem-form">
            
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12">
    
                    <div class="grid grid-cols-1 gap-6 items-center">
                        <!-- Adicionado 'required' para validação do navegador, mas o JS fará a principal -->
                        <label for="origem-nome" class="text-lg font-medium text-gray-300">Nome da Origem *</label>
                        <input type="text" id="origem-nome" name="origem-nome" 
                                placeholder="Ex: Acólito, Criminoso, Sábio..."
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg placeholder-gray-400">
                    </div>

                    <div class="grid grid-cols-1 gap-6 items-center">
                        <label for="origem-moedas" class="text-lg font-medium text-gray-300">Dinheiro Inicial (PO)</label>
                        <input type="text" id="origem-moedas" name="origem-moedas" 
                                placeholder="Ex: 15"
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg placeholder-gray-400">
                    </div>

                </div> 

                <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="origem-pericia-1" class="block text-lg font-medium text-gray-300 mb-2">Proficiência em Perícia 1 *</label>
                        <select id="origem-pericia-1" name="origem-pericia-1" 
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg appearance-none">
                            <option value="">Selecione a primeira perícia...</option>
                            <option value="acrobacia">Acrobacia (Des)</option>
                            <option value="arcanismo">Arcanismo (Int)</option>
                            <option value="atletismo">Atletismo (For)</option>
                            <option value="atuacao">Atuação (Car)</option>
                            <option value="enganacao">Enganação (Car)</option>
                            <option value="furtividade">Furtividade (Des)</option>
                            <option value="historia">História (Int)</option>
                            <option value="intimidacao">Intimidação (Car)</option>
                            <option value="intuicao">Intuição (Sab)</option>
                            <option value="investigacao">Investigação (Int)</option>
                            <option value="lidar_animais">Lidar com Animais (Sab)</option>
                            <option value="medicina">Medicina (Sab)</option>
                            <option value="natureza">Natureza (Int)</option>
                            <option value="percepcao">Percepção (Sab)</option>
                            <option value="persuasao">Persuasão (Car)</option>
                            <option value="prestidigitacao">Prestidigitação (Des)</option>
                            <option value="religiao">Religião (Int)</option>
                            <option value="sobrevivencia">Sobrevivência (Sab)</option>
                        </select>
                    </div>
                    <div>
                        <label for="origem-pericia-2" class="block text-lg font-medium text-gray-300 mb-2">Proficiência em Perícia 2 *</label>
                        <select id="origem-pericia-2" name="origem-pericia-2" 
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg appearance-none">
                            <option value="">Selecione a segunda perícia...</option>
                            <option value="acrobacia">Acrobacia (Des)</option>
                            <option value="arcanismo">Arcanismo (Int)</option>
                            <option value="atletismo">Atletismo (For)</option>
                            <option value="atuacao">Atuação (Car)</option>
                            <option value="enganacao">Enganação (Car)</option>
                            <option value="furtividade">Furtividade (Des)</option>
                            <option value="historia">História (Int)</option>
                            <option value="intimidacao">Intimidação (Car)</option>
                            <option value="intuicao">Intuição (Sab)</option>
                            <option value="investigacao">Investigação (Int)</option>
                            <option value="lidar_animais">Lidar com Animais (Sab)</option>
                            <option value="medicina">Medicina (Sab)</option>
                            <option value="natureza">Natureza (Int)</option>
                            <option value="percepcao">Percepção (Sab)</option>
                            <option value="persuasao">Persuasão (Car)</option>
                            <option value="prestidigitacao">Prestidigitação (Des)</option>
                            <option value="religiao">Religião (Int)</option>
                            <option value="sobrevivencia">Sobrevivência (Sab)</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="origem-prof-ferramenta" class="block text-lg font-medium text-gray-300 mb-2">Prof. em Ferramenta</label>
                        <select id="origem-prof-ferramenta" name="origem-prof-ferramenta" 
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg appearance-none">
                            <option value="">Nenhuma</option>
                            <option value="escolha_artesao">Um tipo de ferramenta de artesão</option>
                            <option value="escolha_instrumento">Um tipo de instrumento musical</option>
                            <option value="escolha_jogo">Um tipo de kit de jogo</option>
                            <option value="kit_disfarce">Kit de Disfarce</option>
                            <option value="kit_falsificacao">Kit de Falsificação</option>
                            <option value="kit_herbalismo">Kit de Herbalismo</option>
                            <option value="kit_veneficio">Kit de Venefício (Envenenador)</option>
                            <option value="ferramentas_ladrao">Ferramentas de Ladrão</option>
                            <option value="ferramentas_navegacao">Ferramentas de Navegador</option>
                        </select>
                    </div>
                    <div>
                        <label for="origem-prof-idioma" class="block text-lg font-medium text-gray-300 mb-2">Prof. em Idioma</LAbel>
                        <select id="origem-prof-idioma" name="origem-prof-idioma" 
                                class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg appearance-none">
                            <option value="">Nenhum</option>
                            <option value="escolha_um">Um idioma à sua escolha</option>
                            <option value="escolha_dois">Dois idiomas à sua escolha</option>
                            <option value="comum">Comum</option>
                            <option value="anao">Anão</option>
                            <option value="elfico">Élfico</option>
                            <option value="gigante">Gigante</option>
                            <option value="gnomico">Gnômico</option>
                            <option value="goblin">Goblin</option>
                            <option value="halfling">Halfling</option>
                            <option value="orc">Orc</option>
                            <option value="abissal">Abissal</option>
                            <option value="celestial">Celestial</option>
                            <option value="draconico">Dracônico</option>
                            <option value="infernal">Infernal</option>
                            <option value="primordial">Primordial</option>
                            <option value="silvestre">Silvestre</option>
                            <option value="subterraneo">Subterrâneo (Undercommon)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-6">
                    <label for="origem-equipamento" class="block text-lg font-medium text-gray-300 mb-2">Equipamento Inicial *</label>
                    <textarea id="origem-equipamento" name="origem-equipamento" rows="3" 
                            class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg placeholder-gray-400"
                            placeholder="Liste os itens. Ex: Um símbolo sagrado, um livro de preces, 5 bastões de incenso..."></textarea>
                </div>

                <hr class="border-t-2 border-gray-700 my-8">
                
                <h3 class="text-2xl font-semibold text-white mb-4">Característica da Origem (Opcional)</h3>
                
                <div class="mb-6">
                    <label for="origem-feature-nome" class="block text-lg font-medium text-gray-300 mb-2">Nome da Característica</label>
                    <input type="text" id="origem-feature-nome" name="origem-feature-nome" 
                            placeholder="Ex: Refúgio do Fiel"
                            class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg placeholder-gray-400">
                </div>

                <div>
                    <label for="origem-feature-descricao" class="block text-lg font-medium text-gray-300 mb-2">Descrição da Característica</label>
                    <textarea id="origem-feature-descricao" name="origem-feature-descricao" rows="5" 
                            class="w-full p-3 rounded bg-[#444444] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-lg placeholder-gray-400"
                            placeholder="Descreva o que a característica da origem faz..."></textarea>
                </div>

                <!-- Mensagem de Erro Adicionada -->
                <div id="origem-error-message" class="hidden mt-6 p-3 rounded text-red-600 text-lg text-center">
                    Por favor, preencha todos os campos obrigatórios.
                </div>

                <div class="mt-10 flex justify-between">
                    <!-- Botão cancelar agora redireciona -->
                    <button type="button" class="px-6 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-semibold transition duration-200 text-lg"
                            onclick="window.location.href='tela-principal.html'">
                        Cancelar
                    </button>
                    <!-- "Finalizar" agora é um botão de submit -->
                    <button type="submit" class="px-6 py-2 rounded bg-green-600 hover:bg-green-500 text-white font-semibold transition duration-200 text-lg">
                        Finalizar
                    </button>
                </div>

            </form>
            
        </div>
    </main>

    <script src="../js/criar-origem.js"></script>
</body>
</html>
