services:
  db:
    image: mysql:8.0
    container_name: mimic_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mimic_db
    ports:
      - "3306:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
